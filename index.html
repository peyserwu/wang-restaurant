<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WANG 餐厅打卡系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans select-none antialiased">

    <!-- 顶部状态栏 -->
    <header class="p-4 bg-slate-800/80 backdrop-blur-md border-b border-slate-700/50 flex justify-between items-center sticky top-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">WANG 打卡助手</span>
        </div>
        <button onclick="openAdminModal()" class="text-xs bg-slate-700/80 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600 flex items-center space-x-1 transition-all">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
            <span>老板后台</span>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-lg mx-auto w-full space-y-6">
        <!-- 实时时间与日期 -->
        <div class="bg-gradient-to-br from-slate-800 to-slate-800/60 p-6 rounded-2xl border border-slate-700/60 shadow-xl text-center relative overflow-hidden">
            <div id="current-date" class="text-slate-400 text-sm font-medium tracking-wide mb-1">加载中...</div>
            <div id="current-time" class="text-5xl font-extrabold tracking-tight font-mono text-white drop-shadow-md">00:00:00</div>
        </div>

        <!-- 员工选择 -->
        <div class="space-y-2">
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider px-1">请选择您的名字</label>
            <div id="employee-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
        </div>

        <!-- 上下班切换 -->
        <div class="space-y-2">
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider px-1">打卡类型</label>
            <div class="grid grid-cols-2 gap-3 p-1.5 bg-slate-800/80 rounded-xl border border-slate-700">
                <button id="btn-in" onclick="setAction('上班')" class="py-3 rounded-lg font-bold transition-all flex items-center justify-center space-x-2 bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20">
                    <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
                    <span>上班打卡</span>
                </button>
                <button id="btn-out" onclick="setAction('下班')" class="py-3 rounded-lg font-bold transition-all flex items-center justify-center space-x-2 text-slate-400 hover:text-white">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>下班打卡</span>
                </button>
            </div>
        </div>

        <!-- 提交按钮 -->
        <button id="btn-submit" onclick="submitClock()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black text-lg rounded-xl shadow-lg shadow-emerald-500/25 active:scale-95 transition-all flex items-center justify-center space-x-2">
            <i data-lucide="check-circle-2" class="w-6 h-6"></i>
            <span>确认打卡</span>
        </button>

        <!-- 今日明细 -->
        <div class="bg-slate-800/40 rounded-xl p-4 border border-slate-700/40 space-y-3">
            <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-700/50 pb-2">
                <span>今日打卡动态</span>
                <span class="text-emerald-400">Supabase 实时云同步</span>
            </div>
            <div id="today-logs" class="space-y-2 max-h-40 overflow-y-auto text-sm"></div>
        </div>
    </main>

    <!-- 成功提示 Modal -->
    <div id="modal-success" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="check" class="w-10 h-10"></i>
            </div>
            <h3 class="text-xl font-bold text-white">打卡成功！</h3>
            <p id="success-desc" class="text-slate-300 text-sm"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold">知道了</button>
        </div>
    </div>

    <!-- 老板后台 Modal -->
    <div id="modal-admin" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 max-w-md w-full space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                    <i data-lucide="shield-check" class="text-emerald-400"></i>
                    <span>老板管理后台</span>
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
            </div>

            <div id="admin-login" class="space-y-4 py-6">
                <p class="text-sm text-slate-400 text-center">请输入管理密码 (默认: 1111)</p>
                <input type="password" id="pin-input" maxlength="6" placeholder="输入密码" class="w-full text-center text-2xl tracking-widest bg-slate-900 border border-slate-700 rounded-xl py-3 text-white">
                <button onclick="verifyPin()" class="w-full py-3 bg-emerald-500 text-slate-950 font-bold rounded-xl">登录后台</button>
            </div>

            <div id="admin-content" class="hidden space-y-4 flex-1 overflow-y-auto">
                <div class="flex items-center justify-between gap-2">
                    <input type="month" id="admin-month" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white">
                    <button onclick="loadAdminLogs()" class="px-3 py-1.5 bg-slate-700 text-xs rounded-lg">查询</button>
                    <button onclick="exportExcel()" class="px-3 py-1.5 bg-emerald-500 text-slate-950 text-xs font-bold rounded-lg flex items-center space-x-1">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span>导出 Excel</span>
                    </button>
                </div>
                <div class="border border-slate-700 rounded-xl overflow-hidden">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
                            <tr><th class="p-2">姓名</th><th class="p-2">类型</th><th class="p-2">时间</th><th class="p-2 text-right">操作</th></tr>
                        </thead>
                        <tbody id="admin-table-body" class="divide-y divide-slate-700/50"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 替换为您自己的 Supabase 凭据 ===
        const SUPABASE_URL = 'https://iwqfqlgxaajdgdvgfilv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Y8aTo2cpVSYHd5SI98pKXA_Busb5tcm';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const employees = ["张伟", "王芳", "李娜", "刘强", "陈杰", "杨洋", "赵敏", "孙伟", "周涛", "吴磊"];
        let selectedEmployee = "";
        let currentAction = "上班";

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            updateClock();
            setInterval(updateClock, 1000);
            renderEmployeeGrid();
            fetchTodayLogs();
            document.getElementById('admin-month').value = new Date().toISOString().substring(0, 7);
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toTimeString().split(' ')[0];
            const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            document.getElementById('current-date').innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weeks[now.getDay()]}`;
        }

        function renderEmployeeGrid() {
            document.getElementById('employee-grid').innerHTML = employees.map(name => `
                <button onclick="selectEmployee('${name}')" class="p-3 rounded-xl border text-left transition-all flex items-center space-x-2 ${selectedEmployee === name ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold' : 'bg-slate-800/80 border-slate-700/80 text-slate-300'}">
                    <div class="w-7 h-7 rounded-full ${selectedEmployee === name ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-slate-300'} flex items-center justify-center font-bold text-xs">${name[0]}</div>
                    <span class="truncate text-sm">${name}</span>
                </button>
            `).join('');
        }

        function selectEmployee(name) { selectedEmployee = name; renderEmployeeGrid(); }

        function setAction(action) {
            currentAction = action;
            document.getElementById('btn-in').className = action === '上班' ? "py-3 rounded-lg font-bold flex items-center justify-center space-x-2 bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20" : "py-3 rounded-lg font-bold flex items-center justify-center space-x-2 text-slate-400";
            document.getElementById('btn-out').className = action === '下班' ? "py-3 rounded-lg font-bold flex items-center justify-center space-x-2 bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20" : "py-3 rounded-lg font-bold flex items-center justify-center space-x-2 text-slate-400";
        }

        async function submitClock() {
            if (!selectedEmployee) return alert('请先选择名字！');
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const monthStr = dateStr.substring(0, 7);

            const { error } = await supabaseClient.from('clock_logs').insert([
                { employee_name: selectedEmployee, action: currentAction, timestamp: now.toISOString(), date: dateStr, month: monthStr }
            ]);

            if (error) {
                alert('提交失败：' + error.message);
                return;
            }

            confetti({ particleCount: 50 });
            document.getElementById('success-desc').innerText = `${selectedEmployee} 成功【${currentAction}】\n时间：${now.toLocaleTimeString()}`;
            document.getElementById('modal-success').classList.remove('hidden');
            fetchTodayLogs();
        }

        async function fetchTodayLogs() {
            const today = new Date().toISOString().split('T')[0];
            const { data } = await supabaseClient.from('clock_logs').select('*').eq('date', today).order('id', { ascending: false });
            
            document.getElementById('today-logs').innerHTML = (data || []).map(i => `
                <div class="flex justify-between items-center bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
                    <span class="font-medium text-slate-200">${i.employee_name}</span>
                    <span class="text-xs px-2 py-0.5 rounded ${i.action === '上班' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${i.action}</span>
                    <span class="text-xs text-slate-400 font-mono">${new Date(i.timestamp).toLocaleTimeString()}</span>
                </div>
            `).join('');
        }

        function closeModal() { document.getElementById('modal-success').classList.add('hidden'); }
        function openAdminModal() { document.getElementById('modal-admin').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('modal-admin').classList.add('hidden'); }

        async function verifyPin() {
            if (document.getElementById('pin-input').value !== "1111") return alert("密码错误！");
            document.getElementById('admin-login').classList.add('hidden');
            document.getElementById('admin-content').classList.remove('hidden');
            loadAdminLogs();
        }

        async function loadAdminLogs() {
            const month = document.getElementById('admin-month').value;
            const { data } = await supabaseClient.from('clock_logs').select('*').eq('month', month).order('timestamp', { ascending: false });
            window.adminLogsData = data || [];
            
            document.getElementById('admin-table-body').innerHTML = window.adminLogsData.map(log => `
                <tr>
                    <td class="p-2 font-medium">${log.employee_name}</td>
                    <td class="p-2"><span class="${log.action === '上班' ? 'text-emerald-400' : 'text-amber-400'}">${log.action}</span></td>
                    <td class="p-2 text-slate-400">${new Date(log.timestamp).toLocaleString()}</td>
                    <td class="p-2 text-right"><button onclick="deleteLog(${log.id})" class="text-red-400">删除</button></td>
                </tr>
            `).join('');
        }

        async function deleteLog(id) {
            if (!confirm("确定删除这条记录？")) return;
            await supabaseClient.from('clock_logs').delete().eq('id', id);
            loadAdminLogs();
        }

        function exportExcel() {
            if (!window.adminLogsData) return alert("暂无数据！");
            const exportData = window.adminLogsData.map(i => ({ "姓名": i.employee_name, "类型": i.action, "日期": i.date, "具体时间": new Date(i.timestamp).toLocaleString() }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "考勤表");
            XLSX.writeFile(wb, `考勤明细_${document.getElementById('admin-month').value}.xlsx`);
        }
    </script>
</body>
</html>
