<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANG 餐厅打卡助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- SheetJS (Excel 导出) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- 顶部 Header & Logo -->
    <header class="max-w-xl mx-auto w-full flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center font-extrabold text-white text-xl shadow-lg shadow-red-900/40 brand-title">
                W
            </div>
            <div>
                <div class="brand-title text-lg font-extrabold leading-tight tracking-wide">
                    <span class="text-red-500">WANG</span> <span class="text-slate-200">Sushi Grill Wok & Bar</span>
                </div>
                <div class="text-[10px] text-slate-400 font-medium">
                    Prinzenstraße 64, 47475 Kamp-Lintfort | Tel: 028422628
                </div>
            </div>
        </div>
        <button onclick="toggleBossModal(true)" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition border border-slate-700">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
            老板后台
        </button>
    </header>

    <!-- 主体打卡区域 -->
    <main class="max-w-xl mx-auto w-full flex-1 flex flex-col items-center justify-center space-y-6">
        
        <!-- 时钟显示 -->
        <div class="text-center">
            <div id="clock-date" class="text-slate-400 text-sm font-semibold tracking-wider">----.--.--</div>
            <div id="clock-time" class="text-4xl md:text-5xl font-black tracking-tight text-white my-1 font-mono">00:00:00</div>
        </div>

        <!-- 员工选择 (10名员工) -->
        <div class="w-full">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">请选择您的名字</label>
            <div id="employee-grid" class="grid grid-cols-2 md:grid-cols-3 gap-2.5">
                <!-- 由 JavaScript 动态渲染员工按钮 -->
            </div>
        </div>

        <!-- 打卡类型切换 -->
        <div class="w-full grid grid-cols-2 gap-3 p-1 bg-slate-900/80 rounded-xl border border-slate-800">
            <button id="btn-in" onclick="setAction('clock_in')" class="flex items-center justify-center gap-2 py-3 rounded-lg font-bold text-sm transition bg-emerald-600 text-white shadow-lg shadow-emerald-900/30">
                <i data-lucide="arrow-right-to-line" class="w-4 h-4"></i> 上班打卡
            </button>
            <button id="btn-out" onclick="setAction('clock_out')" class="flex items-center justify-center gap-2 py-3 rounded-lg font-bold text-sm transition text-slate-400 hover:text-white">
                <i data-lucide="arrow-left-from-line" class="w-4 h-4"></i> 下班打卡
            </button>
        </div>

        <!-- 确认打卡大按钮 -->
        <button id="btn-submit" onclick="handleClockSubmit()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg rounded-xl shadow-xl shadow-emerald-950/50 flex items-center justify-center gap-2 transition active:scale-[0.99]">
            <i data-lucide="check-circle-2" class="w-6 h-6"></i> 确认打卡
        </button>

    </main>

    <!-- 底部微缩署名 -->
    <footer class="max-w-xl mx-auto w-full text-center text-[11px] text-slate-600 mt-8">
        Designed by Peyser's Studio
    </footer>

    <!-- 老板后台 Modal -->
    <div id="boss-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl p-6 shadow-2xl space-y-4">
            
            <!-- PIN 验证界面 -->
            <div id="boss-auth-view" class="space-y-4 py-4 text-center">
                <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center mx-auto text-emerald-400">
                    <i data-lucide="lock" class="w-6 h-6"></i>
                </div>
                <h3 class="text-lg font-bold text-white">请输入老板验证密码</h3>
                <input type="password" id="boss-pin-input" maxlength="4" placeholder="****" class="w-32 mx-auto text-center text-2xl tracking-widest font-mono bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
                <div class="flex justify-center gap-3 pt-2">
                    <button onclick="toggleBossModal(false)" class="px-4 py-2 bg-slate-800 text-slate-300 font-semibold text-sm rounded-xl hover:bg-slate-700">取消</button>
                    <button onclick="verifyBossPin()" class="px-5 py-2 bg-emerald-600 text-white font-semibold text-sm rounded-xl hover:bg-emerald-500">进入后台</button>
                </div>
            </div>

            <!-- 数据管理界面 -->
            <div id="boss-dashboard-view" class="hidden space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 class="font-bold text-white text-base flex items-center gap-2">
                        <i data-lucide="database" class="w-5 h-5 text-emerald-400"></i> 月度打卡记录导出
                    </h3>
                    <button onclick="toggleBossModal(false)" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>

                <div class="flex gap-3">
                    <input type="month" id="filter-month" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 text-sm focus:outline-none focus:border-emerald-500">
                    <button onclick="loadBossLogs()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold rounded-xl flex items-center gap-1.5">
                        <i data-lucide="search" class="w-4 h-4"></i> 查询
                    </button>
                    <button onclick="exportToExcel()" class="ml-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-xl flex items-center gap-1.5 shadow-lg shadow-emerald-950/50">
                        <i data-lucide="download" class="w-4 h-4"></i> 导出 Excel
                    </button>
                </div>

                <div class="max-h-80 overflow-y-auto border border-slate-800 rounded-xl">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-950 text-slate-400 uppercase font-bold sticky top-0">
                            <tr>
                                <th class="p-3">姓名</th>
                                <th class="p-3">类型</th>
                                <th class="p-3">打卡时间</th>
                            </tr>
                        </thead>
                        <tbody id="boss-log-tbody" class="divide-y divide-slate-800/50">
                            <!-- 动态加载日志列表 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 配置 Supabase SDK
        const SUPABASE_URL = 'https://iwqfqlgxaajdgdvgfilv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Y8aTo2cpVSYHd5SI98pKXA_Busb5tcm';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const employees = ["张伟", "王芳", "李娜", "刘强", "陈杰", "杨洋", "赵敏", "孙伟", "周涛", "吴磊"];
        let selectedEmployee = employees[0];
        let currentAction = 'clock_in'; // 'clock_in' | 'clock_out'

        // 初始化页面
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            startClock();
            renderEmployees();
            
            // 设置当前月份默认值
            const today = new Date();
            document.getElementById('filter-month').value = today.toISOString().slice(0, 7);
        });

        // 实时时钟
        function startClock() {
            const update = () => {
                const now = new Date();
                document.getElementById('clock-date').innerText = now.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' });
                document.getElementById('clock-time').innerText = now.toTimeString().split(' ')[0];
            };
            update();
            setInterval(update, 1000);
        }

        // 渲染员工名册
        function renderEmployees() {
            const grid = document.getElementById('employee-grid');
            grid.innerHTML = employees.map(emp => `
                <button onclick="selectEmployee('${emp}')" class="emp-btn p-3 rounded-xl border text-sm font-bold transition text-center ${emp === selectedEmployee ? 'bg-emerald-950/40 border-emerald-500 text-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'}">
                    ${emp}
                </button>
            `).join('');
        }

        function selectEmployee(name) {
            selectedEmployee = name;
            renderEmployees();
        }

        // 切换上班/下班打卡类型
        function setAction(action) {
            currentAction = action;
            const btnIn = document.getElementById('btn-in');
            const btnOut = document.getElementById('btn-out');

            if (action === 'clock_in') {
                btnIn.className = "flex items-center justify-center gap-2 py-3 rounded-lg font-bold text-sm transition bg-emerald-600 text-white shadow-lg shadow-emerald-900/30";
                btnOut.className = "flex items-center justify-center gap-2 py-3 rounded-lg font-bold text-sm transition text-slate-400 hover:text-white";
            } else {
                btnIn.className = "flex items-center justify-center gap-2 py-3 rounded-lg font-bold text-sm transition text-slate-400 hover:text-white";
                btnOut.className = "flex items-center justify-center gap-2 py-3 rounded-lg font-bold text-sm transition bg-amber-600 text-white shadow-lg shadow-amber-900/30";
            }
        }

        // 提交打卡（带状态拦截校验）
        async function handleClockSubmit() {
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = '打卡核验中...';

            try {
                // 1. 使用 Supabase SDK 查询该员工最新一条打卡记录
                const { data: lastLog, error: queryError } = await supabaseClient
                    .from('clock_logs')
                    .select('action')
                    .eq('employee_name', selectedEmployee)
                    .order('timestamp', { ascending: false })
                    .limit(1);

                if (queryError) throw queryError;

                if (lastLog && lastLog.length > 0) {
                    const lastAction = lastLog[0].action; // '上班' 或 '下班'
                    if (currentAction === 'clock_in' && lastAction === '上班') {
                        alert(`⚠️ 员工 [${selectedEmployee}] 当前已处于上班状态，请勿重复【上班打卡】！`);
                        resetSubmitButton();
                        return;
                    }
                    if (currentAction === 'clock_out' && lastAction === '下班') {
                        alert(`⚠️ 员工 [${selectedEmployee}] 当前尚未上班，请勿重复【下班打卡】！`);
                        resetSubmitButton();
                        return;
                    }
                } else if (currentAction === 'clock_out') {
                    alert(`⚠️ 员工 [${selectedEmployee}] 无此前上班记录，无法直接进行下班打卡！`);
                    resetSubmitButton();
                    return;
                }

                // 2. 状态正常，使用 Supabase SDK 写入
                const now = new Date();
                const actionText = currentAction === 'clock_in' ? '上班' : '下班';

                const { error: insertError } = await supabaseClient
                    .from('clock_logs')
                    .insert([
                        {
                            employee_name: selectedEmployee,
                            action: actionText,
                            timestamp: now.toISOString(),
                            date: now.toISOString().slice(0, 10),
                            month: now.toISOString().slice(0, 7)
                        }
                    ]);

                if (insertError) throw insertError;

                // 3. 打卡成功放彩花特效
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.7 }
                });

                alert(`🎉 [${selectedEmployee}] ${actionText}打卡成功！\n时间：${now.toLocaleTimeString()}`);

            } catch (err) {
                console.error(err);
                alert('提交失败：' + (err.message || '网络问题，请重试'));
            } finally {
                resetSubmitButton();
            }
        }

        function resetSubmitButton() {
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<i data-lucide="check-circle-2" class="w-6 h-6"></i> 确认打卡`;
            lucide.createIcons();
        }

        // 老板后台逻辑
        function toggleBossModal(show) {
            const modal = document.getElementById('boss-modal');
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.getElementById('boss-auth-view').classList.remove('hidden');
                document.getElementById('boss-dashboard-view').classList.add('hidden');
                document.getElementById('boss-pin-input').value = '';
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function verifyBossPin() {
            const pin = document.getElementById('boss-pin-input').value;
            if (pin === '1111') {
                document.getElementById('boss-auth-view').classList.add('hidden');
                document.getElementById('boss-dashboard-view').classList.remove('hidden');
                loadBossLogs();
            } else {
                alert('密码错误！');
            }
        }

        let currentLogsCache = [];

        async function loadBossLogs() {
            const month = document.getElementById('filter-month').value;
            const tbody = document.getElementById('boss-log-tbody');
            tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">加载中...</td></tr>`;

            try {
                const { data, error } = await supabaseClient
                    .from('clock_logs')
                    .select('*')
                    .eq('month', month)
                    .order('timestamp', { ascending: false });

                if (error) throw error;
                currentLogsCache = data || [];

                if (currentLogsCache.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">本月暂无打卡记录</td></tr>`;
                    return;
                }

                tbody.innerHTML = currentLogsCache.map(log => `
                    <tr class="hover:bg-slate-800/50">
                        <td class="p-3 font-semibold text-slate-200">${log.employee_name}</td>
                        <td class="p-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${log.action === '上班' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                                ${log.action}
                            </span>
                        </td>
                        <td class="p-3 text-slate-400 font-mono">${new Date(log.timestamp).toLocaleString('zh-CN')}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-400">加载失败</td></tr>`;
            }
        }

        function exportToExcel() {
            if (currentLogsCache.length === 0) {
                alert('当前无数据可导出！');
                return;
            }

            const exportData = currentLogsCache.map(log => ({
                "员工姓名": log.employee_name,
                "打卡类型": log.action,
                "打卡日期": log.date,
                "打卡具体时间": new Date(log.timestamp).toLocaleString('zh-CN')
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "打卡记录");

            const month = document.getElementById('filter-month').value;
            XLSX.writeFile(workbook, `WANG餐厅打卡记录_${month}.xlsx`);
        }
    </script>
</body>
</html>
